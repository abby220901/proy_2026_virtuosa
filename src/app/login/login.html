<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      
      <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
        
        <div class="text-center mb-4">
          <span class="badge login-badge mb-2 px-3 py-2 rounded-pill">
            Acceso a Clientes
          </span>
          <h1 class="h3 fw-bold mb-1" style="color: #df5c8e;">Iniciar Sesión</h1>
          <p class="small text-muted mb-0">
            Ingresa a tu cuenta de Virtuosa's Room para ver tus pedidos y favoritos.
          </p>
        </div>

        @if (mensajeError) {
          <div class="alert alert-danger border-0 rounded-3 py-2 px-3 small mb-3" role="alert">
            {{ mensajeError }}
          </div>
        }

        @if (mensajeExito) {
          <div class="alert alert-success border-0 rounded-3 py-2 px-3 small mb-3" role="alert">
            {{ mensajeExito }}
          </div>
        }

        <form (ngSubmit)="onLogin()">
          
          <div class="mb-3">
            <label for="loginEmail" class="form-label small text-muted mb-1">Correo electrónico</label>
            <input type="email" 
                   id="loginEmail" 
                   name="email"
                   class="form-control custom-input" 
                   placeholder="nombre@ejemplo.com"
                   [(ngModel)]="email"
                   required>
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label for="loginPassword" class="form-label small text-muted mb-0">Contraseña</label>
              <button type="button" 
                      class="btn btn-link btn-sm p-0 text-decoration-none small" 
                      style="color: #df5c8e;"
                      (click)="mostrarPassword = !mostrarPassword">
                {{ mostrarPassword ? 'Ocultar' : 'Mostrar' }}
              </button>
            </div>
            <input [type]="mostrarPassword ? 'text' : 'password'" 
                   id="loginPassword" 
                   name="password"
                   class="form-control custom-input" 
                   placeholder="••••••••"
                   [(ngModel)]="password"
                   required>
          </div>

          <button type="submit" class="btn btn-login w-100 py-2 mb-3" [disabled]="cargando">
            {{ cargando ? 'Ingresando...' : 'Entrar a mi cuenta' }}
          </button>

        </form>

        <p class="text-center small text-muted mb-0">
          ¿Aún no tienes cuenta? 
          <a routerLink="/signin" class="text-decoration-none" style="color: #df5c8e;">
            Regístrate aquí
          </a>
        </p>

      </div>

    </div>
  </div>
</div>
